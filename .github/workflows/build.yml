name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk glassgate-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glassgate-debug-apk
          path: glassgate-debug.apk

      # Every push to main refreshes the "latest" pre-release, so there is always
      # one stable download link: Releases > latest > glassgate-debug.apk
      - name: Drop previous latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes || true

      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: "Debug build of ${{ github.sha }} (run #${{ github.run_number }}). Install glassgate-debug.apk."
          files: glassgate-debug.apk
